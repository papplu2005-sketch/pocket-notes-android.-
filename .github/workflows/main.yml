
name: Build Pocket Notes Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check repository files
        run: |
          echo "Repository files:"
          ls -la
          echo "Checking for Android project files..."
          find . -maxdepth 3 \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" -o -name "package.json" \) -print
          
